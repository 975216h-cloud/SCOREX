
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCOREX</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10151d;color:white;font-family:Arial}
header{background:#182330;padding:22px;text-align:center}
.logo{font-size:30px;font-weight:bold;color:#32df87}
nav{display:flex;justify-content:space-around;background:#202d3b;padding:15px}
nav span{color:white;font-weight:bold}
main{padding:16px}
h2{color:#32df87}
.match{background:#202d3b;border-radius:12px;padding:20px;margin:14px 0;text-align:center}
.teams{display:flex;justify-content:space-around;align-items:center;font-size:17px}
.score{font-size:27px;color:#32df87;font-weight:bold}
.status{color:#aaa;margin-top:12px}
footer{text-align:center;color:#888;padding:25px}
</style>
</head>
<body>
<header>
<div class="logo">⚽ SCOREX</div>
<p>عالم كرة القدم بين يديك</p>
</header>
<nav>
<span>الرئيسية</span>
<span>المباريات</span>
<span>الدوريات</span>
</nav>
<main>
<h2>⚡ المباريات</h2>
<div class="match">
<div class="teams">
<span>ريال مدريد</span>
<span class="score">VS</span>
<span>برشلونة</span>
</div>
<div class="status">موعد المباراة قريباً</div>
</div>
<div class="match">
<div class="teams">
<span>مانشستر سيتي</span>
<span class="score">VS</span>
<span>ليفربول</span>
</div>
<div class="status">موعد المباراة قريباً</div>
</div>
<h2>🌍 جميع الدوريات</h2>
<div class="match">🇪🇸 الدوري الإسباني</div>
<div class="match">🏴 الدوري الإنجليزي</div>
<div class="match">🇮🇹 الدوري الإيطالي</div>
<div class="match">🇩🇪 الدوري الألماني</div>
<div class="match">🇫🇷 الدوري الفرنسي</div>
</main>
<footer>SCOREX © 2026</footer>
</body>
</html>
